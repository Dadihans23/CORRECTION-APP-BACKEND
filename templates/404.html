<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page introuvable · Corrige Moi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 24px;
    }

    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(124,58,237,.18), rgba(124,58,237,.06));
      border: 1.5px solid rgba(124,58,237,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      box-shadow: 0 0 40px rgba(124,58,237,.15);
    }

    .icon-wrap svg {
      width: 44px;
      height: 44px;
      color: #a78bfa;
    }

    .code {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 15px;
      color: rgba(255,255,255,.45);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
    }
    .btn:hover { opacity: .85; transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff;
      box-shadow: 0 8px 20px rgba(124,58,237,.3);
    }

    .btn-ghost {
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.1);
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 2px;
      margin: 24px auto;
    }

    .path-hint {
      display: inline-block;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: rgba(255,255,255,.3);
      font-family: monospace;
      margin-bottom: 32px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="icon-wrap">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
    </div>

    <div class="code">404</div>

    <div class="divider"></div>

    <h1>Page introuvable</h1>

    {% if request %}
    <div class="path-hint">{{ request.path }}</div>
    {% endif %}

    <p>
      La page que vous recherchez n'existe pas ou a été déplacée.<br>
      Vérifiez l'URL ou retournez à l'accueil.
    </p>

    <div class="actions">
      <a href="/custom-admin/" class="btn btn-primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>
      <a href="javascript:history.back()" class="btn btn-ghost">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Retour
      </a>
    </div>

  </div>
</body>
</html>

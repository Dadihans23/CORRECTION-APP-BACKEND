<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 – Accès refusé · Corrige Moi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 24px;
    }

    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(239,68,68,.18), rgba(239,68,68,.06));
      border: 1.5px solid rgba(239,68,68,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      box-shadow: 0 0 40px rgba(239,68,68,.15);
    }

    .icon-wrap svg {
      width: 44px;
      height: 44px;
      color: #fca5a5;
    }

    .code {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #fca5a5, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 15px;
      color: rgba(255,255,255,.45);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
    }
    .btn:hover { opacity: .85; transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 8px 20px rgba(239,68,68,.3);
    }

    .btn-ghost {
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.1);
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, #ef4444, #fca5a5);
      border-radius: 2px;
      margin: 24px auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: #fca5a5;
      font-weight: 600;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="icon-wrap">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
      </svg>
    </div>

    <div class="code">403</div>

    <div class="divider"></div>

    <h1>Accès refusé</h1>

    <div class="badge">
      <svg width="12" height="12" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
      </svg>
      Droits insuffisants
    </div>

    <p>
      Vous n'avez pas les autorisations nécessaires pour accéder à cette section.<br>
      Seuls les administrateurs peuvent y accéder.
    </p>

    <div class="actions">
      <a href="/admin/login/" class="btn btn-primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
        </svg>
        Se connecter
      </a>
      <a href="javascript:history.back()" class="btn btn-ghost">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Retour
      </a>
    </div>

  </div>
</body>
</html>

{% extends "custom_admin/base_admin.html" %}

{% block title %}Nouvel Abonnement{% endblock %}
{% block page_title %}Nouvel Abonnement{% endblock %}

{% block content %}
<!-- Back link -->
<div class="mb-6">
    <a href="{% url 'custom_admin:subscriptions' %}" class="inline-flex items-center gap-1 text-sm text-white/50 hover:text-primary-400 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Retour aux abonnements
    </a>
</div>

<div class="max-w-2xl">
    <div class="glass-card rounded-xl p-6">
        <h3 class="text-sm font-semibold text-white/70 mb-6">Creer un nouvel abonnement</h3>

        <form method="post">
            {% csrf_token %}

            <div class="space-y-5 mb-6">
                <div>
                    <label for="phone_number" class="block text-xs font-medium text-white/50 mb-1">Numero de telephone</label>
                    <input type="text" id="phone_number" name="phone_number" placeholder="+2250701234567" required
                           class="dark-input block w-full rounded-lg px-3 py-2 text-sm">
                </div>

                <div>
                    <label for="pack" class="block text-xs font-medium text-white/50 mb-1">Pack</label>
                    <select id="pack" name="pack" required
                            class="dark-input block w-full rounded-lg px-3 py-2 text-sm">
                        <option value="">-- Selectionner un pack --</option>
                        {% for pack in packs %}
                        <option value="{{ pack.id }}">{{ pack.name }} - {{ pack.price }} CFA</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="inline-flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="is_active" value="1" checked
                               class="w-4 h-4 rounded border-white/20 text-primary-500 focus:ring-primary-500 bg-white/5">
                        <span class="text-sm font-medium text-white/70">Abonnement actif</span>
                    </label>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3 pt-4 border-t border-white/5">
                <button type="submit"
                        class="bg-primary-500 hover:bg-primary-600 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm">
                    Creer
                </button>
                <a href="{% url 'custom_admin:subscriptions' %}"
                   class="inline-flex items-center px-4 py-2 text-sm font-medium bg-white/5 border border-white/10 text-white/70 rounded-lg hover:bg-white/10 transition-colors">
                    Annuler
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
